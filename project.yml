name: Wocheneinkauf
options:
  bundleIdPrefix: de.egler
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wocheneinkauf:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kammer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Zum Scannen von Barcodes, Kassenbons und Haushalts-Codes.
        NSPhotoLibraryUsageDescription: Für Produktfotos.
        NSMicrophoneUsageDescription: Damit du Kammer per Sprache bedienen kannst.
        NSSpeechRecognitionUsageDescription: Wandelt deine Sprachbefehle in Text um – wenn möglich direkt auf dem iPhone.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Für die Verbindung zu deinem OmniRoute-Server im Heimnetz.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.egler.wocheneinkauf
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
